<h5 class="modal-header d-flex justify-content-between">Create Member <i (click)="closeModal()"
        class="fa fa-close cursor-pointer"></i></h5>
<div class="modal-body">
    <form [formGroup]="memberForm" (ngSubmit)="createUpdateMember()" *ngIf="ready">
        <div class="mb-2">
            <label class="form-label">First Name <span class="text-danger">*</span></label>
            <input type="text" formControlName="fullName" class="form-control form-control-sm" placeholder="First Name">
        </div>

        <div class="mb-2">
            <label class="form-label">Email <span class="text-danger">*</span></label>
            <input type="email" formControlName="email" class="form-control form-control-sm" placeholder="Email">
        </div>

        <div class="mb-2">
            <label class="form-label">Username</label>
            <input type="text" formControlName="username" class="form-control form-control-sm" placeholder="Username">
        </div>

        <div class="mb-2">
            <label class="form-label">Phone</label>
            <input type="text" formControlName="phone" class="form-control form-control-sm" placeholder="Phone">
        </div>

        <div class="mb-2">
            <label class="form-label">Date of Birth</label>
            <input type="date" formControlName="dateOfBirth" class="form-control form-control-sm" placeholder="DOB">
        </div>

        <div class="mb-2">
            <label class="form-label">Address</label>
            <input type="text" formControlName="address" class="form-control form-control-sm" placeholder="Address">
        </div>
    </form>

</div>
<div class="modal-footer">
    <button type="button" class="btn btn-sm btn-danger me-2" (click)="closeModal()">Cancel</button>
    <button type="submit" class="btn btn-sm btn-primary" (click)="createUpdateMember()"
        [disabled]="memberForm.invalid || memberForm.pristine">Save</button>
</div>
